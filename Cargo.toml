[package]
name = "nexora"
version = "0.1.0"
edition = "2021"
description = "Secure, cost-aware LLM gateway"
license = "Apache-2.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "json"] }
serde_json = "1"
dotenvy = "0.15"
sha2 = "0.11"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
